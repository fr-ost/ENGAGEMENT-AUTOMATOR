name: X daily automation

on:
  schedule:
    # A starter and safety net only. GitHub starts scheduled runs hours late and skips
    # most of them, so nothing depends on this firing on time: a run that has orders
    # waiting keeps itself alive, places each one when it is due, and hands over to
    # the next run by itself (x-daily-automation/src/keepalive.py).
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      scan_since:
        description: "Recovery: rescan posts created since this UTC time (e.g. 2026-10-01T00:00:00Z). Leave empty for normal runs."
        required: false
        default: ""
      dry_run:
        description: "Dry run: scan and print the report, but save nothing and send no notification"
        type: boolean
        default: false
      allow_state_reinit:
        description: "Recovery: quarantine corrupt state files and start them fresh"
        type: boolean
        default: false
      handover:
        description: "Internal: set by the bot when one run hands over to the next. Leave unticked."
        type: boolean
        default: false
      keep_alive_minutes:
        description: "Advanced: minutes one run stays alive before handing over to a fresh one (default 320)"
        required: false
        default: ""

# Least privilege: nothing by default; the job below gets only what it needs.
permissions: {}

# Never run two copies at once; queue instead of cancelling a run mid-write.
concurrency:
  group: x-daily-automation
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # GitHub ends a job at 360; the bot hands over to a fresh run well before
    permissions:
      contents: write # commit data/ and reports/
      actions: write # see whether another run is waiting, and start the next run at hand-over
    defaults:
      run:
        working-directory: x-daily-automation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the bot rebases its state commits if the branch moves while it runs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            x-daily-automation/requirements.txt
            x-daily-automation/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (offline, mocked APIs)
        run: python -m pytest

      - name: Run the bot
        id: bot
        continue-on-error: true # still save the failure report; the job is failed in the last step
        env:
          # Secrets (Settings → Secrets and variables → Actions → Secrets)
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SMM_API_KEY: ${{ secrets.SMM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Non-secret settings (… → Actions → Variables)
          X_USERNAME: ${{ vars.X_USERNAME }}
          X_USER_ID: ${{ vars.X_USER_ID }}
          INCLUDE_QUOTE_POSTS: ${{ vars.INCLUDE_QUOTE_POSTS }}
          X_MAX_PAGES: ${{ vars.X_MAX_PAGES }}
          SCAN_OVERLAP_HOURS: ${{ vars.SCAN_OVERLAP_HOURS }}
          SCAN_INTERVAL_HOURS: ${{ vars.SCAN_INTERVAL_HOURS }}
          INITIAL_LOOKBACK_HOURS: ${{ vars.INITIAL_LOOKBACK_HOURS }}
          METRICS_LOOKBACK_DAYS: ${{ vars.METRICS_LOOKBACK_DAYS }}
          IMPRESSION_TARGET: ${{ vars.IMPRESSION_TARGET }}
          LIKE_TARGET: ${{ vars.LIKE_TARGET }}
          PROMOTION_BUDGET: ${{ vars.PROMOTION_BUDGET }}
          PROMOTION_BUDGET_CURRENCY: ${{ vars.PROMOTION_BUDGET_CURRENCY }}
          SMM_ENABLED: ${{ vars.SMM_ENABLED }}
          SMM_AUTO_ORDER: ${{ vars.SMM_AUTO_ORDER }}
          VIEW_SPLIT_MIN: ${{ vars.VIEW_SPLIT_MIN }}
          VIEW_SPLIT_MAX: ${{ vars.VIEW_SPLIT_MAX }}
          VIEW_SPREAD_HOURS: ${{ vars.VIEW_SPREAD_HOURS }}
          SMM_API_URL: ${{ vars.SMM_API_URL }}
          SMM_IMPRESSION_SERVICE_ID: ${{ vars.SMM_IMPRESSION_SERVICE_ID }}
          SMM_LIKE_SERVICE_ID: ${{ vars.SMM_LIKE_SERVICE_ID }}
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED }}
          X_COST_PER_REQUEST_USD: ${{ vars.X_COST_PER_REQUEST_USD }}
          X_COST_PER_POST_READ_USD: ${{ vars.X_COST_PER_POST_READ_USD }}
          # Manual-run inputs (empty on scheduled runs)
          SCAN_SINCE: ${{ inputs.scan_since }}
          # Manual runs always scan; a run started by a hand-over scans only when a scan is due.
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && inputs.handover != true }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_STATE_REINIT: ${{ inputs.allow_state_reinit }}
          # Keep-alive: auto (while view orders wait and for a day after the latest post), always, or off
          KEEP_ALIVE: ${{ vars.KEEP_ALIVE }}
          KEEP_ALIVE_AFTER_POST_HOURS: ${{ vars.KEEP_ALIVE_AFTER_POST_HOURS }}
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes || '320' }}
          PERSIST_COMMAND: bash ${{ github.workspace }}/.github/scripts/persist-state.sh
          BRANCH: ${{ github.ref_name }}
          START_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: daily.yml
        run: python main.py

      - name: Save state (safety net)
        # The bot saves after every cycle; this catches anything left if it stopped abnormally.
        if: always() && steps.bot.outcome != 'skipped' && inputs.dry_run != true
        env:
          BRANCH: ${{ github.ref_name }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/persist-state.sh"

      - name: Fail job if the bot failed
        if: steps.bot.outcome == 'failure'
        run: |
          echo "::error::The last cycle failed, or the bot could not save or hand over. See the report in x-daily-automation/reports/ and the 'Run the bot' log."
          exit 1
